{% extends "base.html" %}
{% block title %}My Schedule · WFSF{% endblock %}
{% block content %}
<section class="page-head">
  <div class="ph-left">
    <p class="eyebrow">Your itinerary</p>
    <h1 class="display sm">My Schedule</h1>
  </div>
  <div class="ph-meta">
    <span class="meta-pill"><strong>{{ total }}</strong> picked</span>
    {% if total %}<a class="meta-pill link" href="/walk" title="Animated walk preview across the venue">↗ Walk preview</a>{% endif %}
  </div>
</section>
<div id="my-schedule-body">
  {% include "partials/my_schedule_body.html" %}
</div>
{% endblock %}
